name: Deploy Preview

on:
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  issues: write
  checks: read
  contents: write
  deployments: write

jobs:
  deploy-preview:
    name: Deploy PR Preview
    runs-on: ubuntu-latest

    steps:
      - name: Check for deploy command
        id: command
        uses: github/command@v2.0.3
        with:
          command: .deploy-preview
          reaction: eyes
          allowed_contexts: pull_request

      - name: Get PR info
        if: ${{ steps.command.outputs.continue == 'true' }}
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: parseInt(context.issue.number)
            });
            core.setOutput('ref', pr.data.head.ref);
            core.setOutput('sha', pr.data.head.sha);
            core.setOutput('number', context.issue.number);

      - name: Checkout PR branch
        if: ${{ steps.command.outputs.continue == 'true' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ steps.pr.outputs.ref }}

      - name: Setup PNPM and Node
        if: ${{ steps.command.outputs.continue == 'true' }}
        uses: pnpm/setup@v2
        with:
          runtime: node@24.18.0

      - name: Generate static site
        if: ${{ steps.command.outputs.continue == 'true' }}
        run: pnpm generate

      - name: Deploy to Cloudflare Pages
        if: ${{ steps.command.outputs.continue == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .output/public --project-name=petri-net-editor --branch=pr-${{ steps.pr.outputs.number }}

      - name: Find existing comment
        if: ${{ steps.command.outputs.continue == 'true' }}
        id: find-comment
        uses: peter-evans/find-comment@v4
        with:
          issue-number: ${{ steps.pr.outputs.number }}
          comment-author: github-actions[bot]
          body-includes: Preview deployed

      - name: Create or update comment
        if: ${{ steps.command.outputs.continue == 'true' }}
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ steps.pr.outputs.number }}
          body: |
            🚀 **Preview deployed!**

            https://pr-${{ steps.pr.outputs.number }}.petri-net-editor.pages.dev
          edit-mode: replace
