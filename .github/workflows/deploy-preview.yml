name: Deploy Preview

on:
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  issues: write
  checks: read
  contents: write
  deployments: write

jobs:
  deploy-preview:
    name: Deploy PR Preview
    runs-on: ubuntu-latest

    steps:
      - name: Check for deploy command
        id: command
        uses: github/command@3442f3fa1efe01bdb024b157083c337902d17372 # v2.0.3
        with:
          command: .deploy-preview
          reaction: eyes
          allowed_contexts: pull_request
          skip_reviews: true

      - name: Get PR info
        if: ${{ steps.command.outputs.continue == 'true' }}
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: parseInt(context.issue.number)
            });
            core.setOutput('ref', pr.data.head.ref);
            core.setOutput('sha', pr.data.head.sha);
            core.setOutput('number', context.issue.number);

      - name: Checkout PR branch
        if: ${{ steps.command.outputs.continue == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.pr.outputs.ref }}

      - name: Setup PNPM and Node
        if: ${{ steps.command.outputs.continue == 'true' }}
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          runtime: node@24.18.0

      - name: Generate static site
        if: ${{ steps.command.outputs.continue == 'true' }}
        run: pnpm generate

      - name: Deploy to Cloudflare Pages
        if: ${{ steps.command.outputs.continue == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy .output/public --project-name=petri-net-editor --branch=pr-${{ steps.pr.outputs.number }}

      - name: Find existing comment
        if: ${{ steps.command.outputs.continue == 'true' }}
        id: find-comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4
        with:
          issue-number: ${{ steps.pr.outputs.number }}
          comment-author: github-actions[bot]
          body-includes: Preview deployed

      - name: Create or update comment
        if: ${{ steps.command.outputs.continue == 'true' }}
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ steps.pr.outputs.number }}
          body: |
            🚀 **Preview deployed!**

            https://pr-${{ steps.pr.outputs.number }}.petri-net-editor.pages.dev
          edit-mode: replace
