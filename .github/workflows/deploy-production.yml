name: Deploy to Production

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Release]
    types:
      - completed
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-release:
    name: Check for Release
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_run' }}
    outputs:
      released: ${{ steps.check.outputs.released }}
    steps:
      - name: Check for release tag
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          TAGS=$(gh api "repos/{owner}/{repo}/git/commits/$SHA/tags" --jq '.[].name' 2>/dev/null || echo "")
          if [ -n "$TAGS" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "Tags found on commit $SHA: $TAGS"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No tags found on commit $SHA - skipping deploy"
          fi

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: check-release
    if: ${{ needs.check-release.outputs.released == 'true' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PNPM and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          runtime: node@24.18.0

      - name: Generate static site
        run: pnpm generate

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .output/public --project-name=petri-net-editor --branch=main
