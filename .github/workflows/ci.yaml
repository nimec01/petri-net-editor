name: Continuous Integration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.changeset/**'
      - '.devcontainer/**'
      - '.vscode/**'
      - '.agents/**'
      - .gitignore
      - LICENSE
      - 'LICENSE.*'
      - opencode.jsonc
      - skills-lock.json
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.changeset/**'
      - '.devcontainer/**'
      - '.vscode/**'
      - '.agents/**'
      - .gitignore
      - LICENSE
      - 'LICENSE.*'
      - opencode.jsonc
      - skills-lock.json

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  lint:
    name: Build, Lint, Check Types
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Setup PNPM and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          runtime: node@24.20.0

      - name: Build
        run: pnpm build

      - name: Check Types
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

  unit:
    name: Unit Tests
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Setup PNPM and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          runtime: node@24.20.0

      - name: Run tests
        run: pnpm run test:unit

  e2e:
    name: End-to-End Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Setup PNPM and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          runtime: node@24.20.0

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run tests
        run: pnpm run test:e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
